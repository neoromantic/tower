<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower · Live styles</title>
<style>:root{color-scheme:dark;font:16px system-ui;color:#f0ebdf;background:#142b30}body{margin:8px}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;min-height:60px;border:1px solid #64746a;border-radius:10px;color:inherit;background:#243c40;padding:12px}button[aria-pressed=true]{background:#e8bd78;color:#202c2a}p{line-height:1.5;color:#c1cfc5}</style>
<nav aria-label="Experiments"><button data-style="0">Architectural schematic</button><button data-style="1">Modern pixel art</button><button data-style="2">Warm dollhouse</button><button data-style="3">Miniature</button></nav>
<article id="styles"><p>Switch the current tower’s complete gameplay graphics in place. Your tower and simulation continue unchanged. Miniature uses rendered sprites.</p></article>
<script>
const buttons = document.querySelectorAll('button');
for (const button of buttons) {
  button.setAttribute('aria-pressed', String(button.dataset.style === parent.document.getElementById('style').value));
  button.onclick = () => {
    parent.postMessage({style: Number(button.dataset.style)}, location.origin);
    for (const item of buttons) item.setAttribute('aria-pressed', String(item === button));
  };
}
</script>
</html>
