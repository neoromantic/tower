name: build-web

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v14
        with:
          version: 6.0.6   # match the Pi's emsdk — same wasm we've been testing
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: bun install --frozen-lockfile
      - run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: tower-web
          path: web/dist
