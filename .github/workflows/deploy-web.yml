name: build-web

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 7.0.0
          path: .emsdk
          persist-credentials: false
      - run: .emsdk/emsdk install 7.0.0 && .emsdk/emsdk activate 7.0.0
      - run: |
          sed -i 's,https://github.com/libsdl-org/SDL/archive/{TAG}.zip,https://codeload.github.com/libsdl-org/SDL/zip/{TAG},' .emsdk/upstream/emscripten/tools/ports/sdl2.py
          sed -i 's,https://github.com/libsdl-org/SDL_ttf/archive/{TAG}.zip,https://codeload.github.com/libsdl-org/SDL_ttf/zip/{TAG},' .emsdk/upstream/emscripten/tools/ports/sdl2_ttf.py
          sed -i 's,https://github.com/freetype/freetype/archive/{TAG}.zip,https://codeload.github.com/freetype/freetype/zip/{TAG},' .emsdk/upstream/emscripten/tools/ports/freetype.py
          sed -i 's,https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz,https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION},' .emsdk/upstream/emscripten/tools/ports/zlib.py
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: bun install --frozen-lockfile
      - run: source .emsdk/emsdk_env.sh && make web
      - uses: actions/upload-artifact@v4
        with:
          name: tower-web
          path: web/dist
